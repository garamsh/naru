name: release

# A pushed tag v* builds the release assets with `make release` and publishes them as a GitHub
# Release named after the tag. workflow_dispatch repeats a run for a tag that already exists.
# The workflow boots no QEMU: the boot test is `make test-qemu`, which a contributor runs.
# A tag whose name contains "-" (v0.1.0-dev.14 or v0.1.0-rc.1) is published as a pre-release and
# not as the latest release (`--prerelease --latest=false`, on both the create and the edit path);
# any other tag is published as before.
#
# A tag publishes once. A run for a tag whose release exists compares the new build's SHA256SUMS
# with the published one (naru-release compare, ADR 0076): if they agree on every asset it uploads,
# signs and attests nothing, and if any differs it fails and names the asset. The publish job
# signs SHA256SUMS with cosign, keyless through this workflow's OIDC identity, and attests the
# provenance of every asset in it.
#
# Moved by (every pin below): the PM, in a pull request that reads the action's current release and
# the GitHub Advisory Database (ci.md), when an advisory is published for it and at each Go minor
# release. No bot proposes the bumps (.github/ holds no dependabot.yml).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing tag to build and publish, for example v0.1.0"
        required: true
        type: string
      requires_recreation:
        description: "The release's kernel does not fit the Nodes of the previous release's image: mark it, and its notes tell them to be recreated"
        required: false
        type: boolean
        default: false

permissions: read-all

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    # A hosted runner label cannot be pinned. It names the version, and the first step records what
    # it resolved to. Moved by: the PM, when GitHub announces the label's retirement.
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
      esp_bytes: ${{ steps.figures.outputs.esp_bytes }}
      upgrade_kernel_bytes: ${{ steps.figures.outputs.upgrade_kernel_bytes }}
    steps:
      - name: Check the tag names a file
        run: |
          case "$TAG" in
            v*) ;;
            *) echo "release: the tag $TAG does not start with v" >&2; exit 1 ;;
          esac
          if ! printf '%s' "$TAG" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._+-]*$'; then
            echo "release: the tag $TAG is not a name to put in a file name" >&2
            exit 1
          fi

      - name: Record what the runner resolved to
        run: |
          echo "image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release
          uname -r
          docker version --format 'docker {{.Server.Version}}'
          nproc
          df -h / | tail -n 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Record the commit built
        id: commit
        run: |
          commit=$(git rev-parse HEAD)
          echo "release: $TAG is commit $commit"
          echo "commit=$commit" >>"$GITHUB_OUTPUT"

      # Go is the version go.work names, for `make ci` below. The image is not built with it: make
      # release runs in the builder container (image.md §The builder), whose Go and compilers are
      # pinned there, so nothing the runner provides reaches the assets. Nothing is cached for the
      # image: the kernel, the initramfs, the guest initrds and the disks are built from the pinned
      # sources on every run.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: "**/go.sum"

      # The manifest of the release with the highest version below this tag, among the
      # published ones. naru-release previous compares versions by SemVer 2.0.0 precedence, so that
      # v0.1.0-dev.10 is above v0.1.0-dev.9 and below v0.1.0.
      # Neither publish time nor commit date plays a part, so a release published
      # after this commit was made, as v0.1.0-dev.9 was, is still found. It is fetched so that make release
      # refuses a kernel its Nodes cannot take (ADR 0037). An earlier release's bundle is a tar of
      # the kernel and the manifest. No earlier release: nothing is checked, and the step says so.
      - name: Fetch the previous release's manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prev=$(gh release list --exclude-drafts --limit 100 --json tagName --jq '.[].tagName' \
            | (cd tooling/qemu && go run ./cmd/naru-release previous "$TAG"))
          if [ -z "$prev" ]; then
            echo "release: no release before $TAG; the upgrade from an earlier image is not checked"
            exit 0
          fi
          mkdir prev
          # The bundle is naru-host-upgrade-<tag>.tar; releases up to v0.1.0-dev.8 carry naru-upgrade-<tag>.tar (ADR 0056).
          if ! gh release download "$prev" --pattern 'naru-host-upgrade-*.tar' --dir prev || ! ls prev/naru-host-upgrade-*.tar >/dev/null 2>&1; then
            gh release download "$prev" --pattern 'naru-upgrade-*.tar' --dir prev
          fi
          bundle=$(ls prev/naru-host-upgrade-*.tar prev/naru-upgrade-*.tar 2>/dev/null | head -n 1)
          [ -n "$bundle" ] || { echo "release: $prev carries no upgrade bundle" >&2; exit 1; }
          tar -xf "$bundle" -C prev manifest.json
          echo "release: the previous release is $prev"
          echo "PREV_MANIFEST=$PWD/prev/manifest.json" >>"$GITHUB_ENV"

      # lib/init/linux's packet-socket test runs in a user and network namespace of its own. Ubuntu
      # 24.04 denies an unprivileged user the capabilities inside one unless this is off.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Unit tests under tooling/qemu build disks with qemu-img and copy OVMF's variable store; the
      # runner image carries neither. They are the distribution's packages, not pinned, and no asset
      # is built with them: make release runs in the builder.
      - name: Install qemu-utils and ovmf
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-utils ovmf

      # The checks of a contributor's tree, before any asset is built from it.
      - name: Check the tree
        run: make ci

      # make release builds the image (the kernels, the guest initrds, the initramfs) and the disks,
      # inside the builder container: the target builds the builder from image/builder first and
      # fails unless its config digest is the one image/builder/builder.env names.
      - name: Build the release assets
        env:
          RECREATE: ${{ inputs.requires_recreation && '1' || '' }}
        run: make release VERSION="$TAG"

      # make release writes the two figures the notes state beside the assets, not in them: every file
      # of build/release is an asset.
      - name: Read the figures of the notes
        id: figures
        run: |
          . build/release-figures.env
          [ -n "$ESP_BYTES" ] && [ -n "$LARGEST_UPGRADE_KERNEL_BYTES" ] || { echo "release: build/release-figures.env has no figures" >&2; exit 1; }
          echo "esp_bytes=$ESP_BYTES" >>"$GITHUB_OUTPUT"
          echo "upgrade_kernel_bytes=$LARGEST_UPGRADE_KERNEL_BYTES" >>"$GITHUB_OUTPUT"

      - name: List the assets
        run: |
          echo "builder: $(grep -E '^BUILDER_CONFIG_DIGEST=' image/builder/builder.env)"
          ls -l build/release
          cat build/release/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: build/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      # id-token: the keyless signature and the provenance attestation are made with this run's
      # OIDC token. attestations: the attestation is stored with the repository.
      id-token: write
      attestations: write
    env:
      COMMIT: ${{ needs.build.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RECREATE: ${{ inputs.requires_recreation && '1' || '' }}
      ESP_BYTES: ${{ needs.build.outputs.esp_bytes }}
      UPGRADE_KERNEL_BYTES: ${{ needs.build.outputs.upgrade_kernel_bytes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      # naru-release compare is Go code of this tree.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release

      # The 15 assets, their SHA256SUMS and nothing else; the signature bundle is added below, and is
      # not in SHA256SUMS because it signs it.
      - name: Check the assets against SHA256SUMS
        working-directory: release
        run: |
          sha256sum --check SHA256SUMS
          n=$(ls | wc -l)
          echo "release: $n file(s), SHA256SUMS lists $(wc -l <SHA256SUMS)"
          [ "$n" -eq 16 ] || { echo "release: expected 16 files" >&2; exit 1; }

      # A tag publishes once (ADR 0076). If the tag's release exists, its SHA256SUMS must agree with
      # this build's on every asset but the ones that differ in each build by design, and then
      # nothing is uploaded, signed or attested again; a release without SHA256SUMS, or one that
      # lacks an asset its SHA256SUMS lists, is not repaired here.
      - name: Compare with the release already published for the tag
        id: existing
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "release: $TAG has no release yet"
            echo "identical=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir published
          gh release download "$TAG" --pattern SHA256SUMS --dir published || true
          if [ ! -s published/SHA256SUMS ]; then
            echo "release: the release of $TAG has no SHA256SUMS, so it cannot be compared; if nobody has used it, delete it (gh release delete $TAG) and run again" >&2
            exit 1
          fi
          (cd tooling/qemu && go run ./cmd/naru-release compare ../../published/SHA256SUMS ../../release/SHA256SUMS)
          have=$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)
          want=$( { awk '{ print $2 }' published/SHA256SUMS; echo SHA256SUMS; echo SHA256SUMS.sigstore.json; } | sort)
          missing=$(comm -13 <(printf '%s\n' "$have") <(printf '%s\n' "$want"))
          if [ -n "$missing" ]; then
            echo "release: the release of $TAG lacks: $missing; if nobody has used it, delete it (gh release delete $TAG) and run again" >&2
            exit 1
          fi
          echo "release: $TAG is already published and this build agrees with it; nothing to upload, sign or attest"
          echo "identical=true" >>"$GITHUB_OUTPUT"

      - name: Write the release notes
        if: steps.existing.outputs.identical != 'true'
        run: |
          flags=
          [ -z "$RECREATE" ] || flags=-requires-recreation
          # The text is docs/operate/release-notes.md.tmpl; the figures and the SHA-256 lines come from this build.
          (cd tooling/qemu && go run ./cmd/naru-release notes -template ../../docs/operate/release-notes.md.tmpl \
            -sums ../../release/SHA256SUMS -tag "$TAG" -commit "$COMMIT" -esp-bytes "$ESP_BYTES" \
            -upgrade-kernel-bytes "$UPGRADE_KERNEL_BYTES" -cacert-pin ../../image/pkgs/cacert/pin.env $flags) >notes.md
          cat notes.md

      # cosign signs SHA256SUMS keyless: Fulcio issues a certificate for this workflow's OIDC
      # identity, and the bundle holds the signature, the certificate and the Rekor entry. SHA256SUMS
      # vouches for every other asset, so one signature covers the release.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: steps.existing.outputs.identical != 'true'
        with:
          cosign-release: "v3.1.4"

      - name: Sign SHA256SUMS
        if: steps.existing.outputs.identical != 'true'
        working-directory: release
        run: |
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          test -s SHA256SUMS.sigstore.json

      # The SLSA provenance of every asset SHA256SUMS lists, stored with the repository.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.existing.outputs.identical != 'true'
        with:
          subject-checksums: release/SHA256SUMS

      - name: Publish the release
        if: steps.existing.outputs.identical != 'true'
        run: |
          # A tag with "-" is a pre-release and never the latest release.
          case "$TAG" in
            *-*) kind="--prerelease --latest=false" ;;
            *) kind="" ;;
          esac
          # The release of the tag does not exist (the step above failed on one that differs, and
          # this step is skipped for one that agrees), so it is created, never edited or overwritten.
          # shellcheck disable=SC2086
          gh release create "$TAG" release/* --verify-tag --title "$TAG" --notes-file notes.md $kind
          gh release view "$TAG" --json tagName,url,assets --jq '.tagName, .url, (.assets[] | "\(.name) \(.size)")'
