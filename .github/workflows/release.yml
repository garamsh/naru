name: release

# A pushed tag v* builds the release assets with `make release` and publishes them as a GitHub
# Release named after the tag. workflow_dispatch repeats a run for a tag that already exists.
# The workflow boots no QEMU: the boot test is `make test-qemu`, which a contributor runs.
# A tag whose name contains "-" (v0.1.0-rc.1) is published as a pre-release and not as the latest
# release (`--prerelease --latest=false`, on both the create and the edit path); any other tag is
# published as before.
#
# Moved by (every pin below): the PM, in a pull request that reads the action's current release and
# the GitHub Advisory Database (ci.md), when an advisory is published for it and at each Go minor
# release. No bot proposes the bumps (.github/ holds no dependabot.yml).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing tag to build and publish, for example v0.1.0"
        required: true
        type: string
      requires_recreation:
        description: "The release's kernel does not fit the Nodes of the previous release's image: mark it, and its notes tell them to be recreated"
        required: false
        type: boolean
        default: false

permissions: read-all

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    # A hosted runner label cannot be pinned. It names the version, and the first step records what
    # it resolved to. Moved by: the PM, when GitHub announces the label's retirement.
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
      esp_bytes: ${{ steps.figures.outputs.esp_bytes }}
      upgrade_kernel_bytes: ${{ steps.figures.outputs.upgrade_kernel_bytes }}
    steps:
      - name: Check the tag names a file
        run: |
          case "$TAG" in
            v*) ;;
            *) echo "release: the tag $TAG does not start with v" >&2; exit 1 ;;
          esac
          if ! printf '%s' "$TAG" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._+-]*$'; then
            echo "release: the tag $TAG is not a name to put in a file name" >&2
            exit 1
          fi

      - name: Record what the runner resolved to
        run: |
          echo "image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release
          uname -r
          gcc --version | head -n 1
          nproc
          df -h / | tail -n 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Record the commit built
        id: commit
        run: |
          commit=$(git rev-parse HEAD)
          echo "release: $TAG is commit $commit"
          echo "commit=$commit" >>"$GITHUB_OUTPUT"

      # Go is the version go.work names. The module cache it keeps is keyed on every go.sum; go.sum
      # and the Go checksum database fix what a cached module means, so a hit cannot change bytes.
      # Nothing else is cached: the kernel, the initramfs, the guest initrds and the disks are built
      # from the pinned sources on every run.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: "**/go.sum"

      # image.md §What the host needs: the kernel's build dependencies, e2fsprogs (mke2fs -d, debugfs), dosfstools, gdisk and qemu-utils for the disk and the release.
      - name: Install what the build needs
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bash bc binutils bison build-essential curl dosfstools e2fsprogs file flex gdisk git \
            gzip libelf-dev libssl-dev perl qemu-utils squashfs-tools tar xz-utils
          for tool in /sbin/mkfs.fat /sbin/sgdisk /sbin/debugfs /sbin/mkfs.ext4 qemu-img mksquashfs; do
            command -v "$tool" >/dev/null || { echo "release: $tool is not installed" >&2; exit 1; }
          done
          mke2fs -V 2>&1 | head -n 1

      # Only the fetch of the mvmd checkout, whose rust-toolchain.toml names the toolchain: make image
      # builds mvmd's guest initrds with it, so the toolchain is installed before any build. rustup is
      # on the runner; it installs the channel, components and targets the file names, in the
      # directory of each Rust workspace the guest inputs build.
      - name: Fetch the pinned sources
        run: image/host/mvmd/checkout.sh build/initramfs/mvmd

      - name: Install the Rust toolchain mvmd names
        run: |
          for dir in guest-agent converter; do
            (cd "build/initramfs/mvmd/$dir" && rustup toolchain install --no-self-update --profile minimal && rustc --version)
          done

      # The manifest of the newest release published before this tag's commit, so that make release
      # refuses a kernel its Nodes cannot take (ADR 0037). An earlier release's bundle is a tar of
      # the kernel and the manifest. No earlier release: nothing is checked, and the step says so.
      - name: Fetch the previous release's manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          date=$(TZ=UTC git log -1 --date=format-local:'%Y-%m-%dT%H:%M:%SZ' --format=%cd)
          prev=$(gh release list --exclude-drafts --limit 100 --json tagName,publishedAt \
            | jq -r --arg tag "$TAG" --arg date "$date" '[.[] | select(.tagName != $tag and .publishedAt < $date)] | sort_by(.publishedAt) | reverse | .[0].tagName // empty')
          if [ -z "$prev" ]; then
            echo "release: no release before $TAG; the upgrade from an earlier image is not checked"
            exit 0
          fi
          mkdir prev
          gh release download "$prev" --pattern 'naru-upgrade-*.tar' --dir prev
          tar -xf prev/naru-upgrade-*.tar -C prev manifest.json
          echo "release: the previous release is $prev"
          echo "PREV_MANIFEST=$PWD/prev/manifest.json" >>"$GITHUB_ENV"

      # make release builds the image (the kernels, the guest initrds, the initramfs) and the disks.
      - name: Build the release assets
        env:
          RECREATE: ${{ inputs.requires_recreation && '1' || '' }}
        run: make release VERSION="$TAG"

      # make release writes the two figures the notes state beside the assets, not in them: every file
      # of build/release is an asset.
      - name: Read the figures of the notes
        id: figures
        run: |
          . build/release-figures.env
          [ -n "$ESP_BYTES" ] && [ -n "$LARGEST_UPGRADE_KERNEL_BYTES" ] || { echo "release: build/release-figures.env has no figures" >&2; exit 1; }
          echo "esp_bytes=$ESP_BYTES" >>"$GITHUB_OUTPUT"
          echo "upgrade_kernel_bytes=$LARGEST_UPGRADE_KERNEL_BYTES" >>"$GITHUB_OUTPUT"

      - name: List the assets
        run: |
          ls -l build/release
          cat build/release/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: build/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      COMMIT: ${{ needs.build.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RECREATE: ${{ inputs.requires_recreation && '1' || '' }}
      ESP_BYTES: ${{ needs.build.outputs.esp_bytes }}
      UPGRADE_KERNEL_BYTES: ${{ needs.build.outputs.upgrade_kernel_bytes }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release

      - name: Check the assets against SHA256SUMS
        working-directory: release
        run: |
          sha256sum --check SHA256SUMS
          n=$(ls | wc -l)
          echo "release: $n file(s), SHA256SUMS lists $(wc -l <SHA256SUMS)"
          [ "$n" -eq 14 ] || { echo "release: expected 14 files" >&2; exit 1; }

      - name: Write the release notes
        run: |
          cat >notes.md <<'NOTES'
          naru @TAG@, built from commit @COMMIT@ by the release workflow on a GitHub-hosted ubuntu-24.04 runner.

          Assets: `naru-@TAG@.qcow2` (the boot disk), `naru-upgrade-@TAG@.tar` (the upgrade bundle: the kernel with its initramfs inside, and a manifest that names its version and SHA-256, which an A/B upgrade writes to the boot disk's trial slot), `naru-data-@TAG@.qcow2` (the data disk both Nodes attach), `naru-node-kernel-@TAG@`, `naru-node-initramfs-@TAG@` and `naru-node-@TAG@.json` (the Node boot set: the kernel and initramfs of the guest form that runs a Node as a microVM, and the manifest that names them with their SHA-256), `naru-orch-ext-@TAG@.sqfs` and `naru-orch-ext-@TAG@.json` (the `naru-orch` system extension that carries `naru-orchd` and `naru-signer`, and its description: the `sha256` field is what `spec.extensions` names, and the image is built for this release's version only), `naru-guest-@TAG@.json` (the names and SHA-256 of the guest kernel and initrds the boot disk carries), `naru-inputs-@TAG@.json` (the Firecracker digest and the test image reference that `naru-cluster` reads), `naructl-@TAG@-linux-amd64` (the operator's tool: it generates a cluster CA, each Node's user-data and client certificates, and it is the Node API's client; a static binary), `naru-node-1.test.yaml` and `naru-node-2.test.yaml` (test-only user-data for Proxmox that runs gaon) and `SHA256SUMS` of the other thirteen.

          - **What this release carries beyond v0.3.0.** init serves the Node API (version, services, service logs, the stored configuration, and applying a change live or staged for the next boot) over mutual TLS on `spec.api.listen`, `0.0.0.0:50000` by default, and `naructl` is its client: `version`, `services`, `logs`, `get config` and `apply`. `naru-init` reports the release's tag as its version. A Node whose user-data has no `spec.api` serves no API and logs that the Node API is off, and user-data written for v0.3.0 boots unchanged.
          - **The Node boot set and the image's room.** `naructl host boot-set add naru-node-@TAG@.json --config <host client config>` adds the boot set to a host that runs mvmd, with no reboot, under the name `naru-node-` and the tag in lower case with each character outside a-z, 0-9 and `-` replaced by `-`; the files it names are read from beside the manifest. The boot disk's ESP is @ESP_BYTES@ bytes, and the largest kernel a Node installed from this image can take as an in-place upgrade is @UPGRADE_KERNEL_BYTES@ bytes.
          - **The test user-data has no `spec.api`.** `naru-node-1.test.yaml` and `naru-node-2.test.yaml` leave the Node API off. To enable it, make the API's authority and write the user-data from the same directory: `naructl gen api-ca --ca-dir <ca-dir>` (the cluster's CA directory, which `gen ca` wrote), then `naructl gen node --ca <ca-dir> ...`, which adds `spec.api` when `<ca-dir>/api/` exists, then `naructl gen api-client --ca-dir <ca-dir> --role admin --endpoint <node-ip> --out client.yaml`, and `naructl version --config client.yaml`. A `reader` role reads and cannot apply.
          - **The data disk carries a test-only TLS authority, private key included.** `inputs/registry/key.pem` is the private key of the CA that `inputs/registry/ca.pem` and `cert.pem` belong to. It is generated for each build, is trusted only by the mvmd on the Node that holds the disk, and the registry that uses it listens on 127.0.0.1. Anyone can read the key from this public asset; do not trust the CA anywhere else.
          - **The user-data assets are test-only and carry private keys.** `naru-node-1.test.yaml` and `naru-node-2.test.yaml` hold the bootstrap tokens of both Nodes in `spec.files`, and `naru-node-1.test.yaml` also holds, in `spec.pki`, a test-only TLS authority, private key included: the CA generated for the build, from which init issues node-1's pairs at boot and gaon's controllers sign the Node Agents' certificate requests. The CA is valid ten years from the build and the certificates one year. Anyone can read that key and those tokens from this public asset: do not trust the CA anywhere else, and use the files on a throwaway deployment only. Two builds of one tree differ in the CA and the tokens.
          - **The data disk is not byte-reproducible.** The registry's TLS authority, certificate and key are generated anew for every build, and they are the only files that differ between two builds of one tree. Pin the digest of the asset published here, not the digest of a rebuild.
          - **Relation to a workstation build.** The boot disk is the output of `make disk`, which `make image-repro` shows byte-identical across two clean builds on one workstation. This release was built on a runner whose compiler and `mke2fs` are Ubuntu 24.04's, and equality with a workstation build of the same commit has not been checked: build the commit with `make release VERSION=@TAG@` and compare `SHA256SUMS`, expecting the data disk to differ.
          NOTES
          if [ -n "$RECREATE" ]; then
            cat >>notes.md <<'NOTES'
          - **A Node installed from an earlier image cannot take this release's upgrade bundle, and must be recreated.** This release's kernel is larger than the trial slot of the ESP of the previous release's image. Recreate the Node from `naru-@TAG@.qcow2`. A Node installed from this image has room for a trial copy of a kernel twice the size of this release's own.
          NOTES
          fi
          sed -i -e "s/@TAG@/$TAG/g" -e "s/@COMMIT@/$COMMIT/g" -e "s/@ESP_BYTES@/$ESP_BYTES/g" -e "s/@UPGRADE_KERNEL_BYTES@/$UPGRADE_KERNEL_BYTES/g" notes.md
          # Each asset's name and SHA-256, from the same build's SHA256SUMS that is attached beside them.
          {
            printf '\n**SHA-256 of each asset** (the same lines as the attached `SHA256SUMS`, which lists every asset but itself):\n\n'
            awk '{ printf "- `%s` `%s`\n", $2, $1 }' release/SHA256SUMS
          } >>notes.md
          cat notes.md

      - name: Publish the release
        run: |
          # A tag with "-" is a pre-release and never the latest release.
          case "$TAG" in
            *-*) kind="--prerelease --latest=false" ;;
            *) kind="" ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            # shellcheck disable=SC2086
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md $kind
            gh release upload "$TAG" release/* --clobber
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" release/* --verify-tag --title "$TAG" --notes-file notes.md $kind
          fi
          gh release view "$TAG" --json tagName,url,assets --jq '.tagName, .url, (.assets[] | "\(.name) \(.size)")'
