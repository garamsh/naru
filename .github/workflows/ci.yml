name: ci

# Runs `make ci`, the whole set a contributor runs locally (docs/convention/ci.md): lint, the import
# and module checks, format, test and build. It needs no Docker, QEMU or image build; the QEMU
# suites are `make test-qemu`, `test-fleet` and `test-harness`, which a contributor runs. shellcheck
# is the one the runner image carries, and its version is recorded on each run.
#
# Moved by (every pin below): the PM, in a pull request that reads the action's current release and
# the GitHub Advisory Database (ci.md), when an advisory is published for it and at each Go minor
# release. No bot proposes the bumps (.github/ holds no dependabot.yml). The pins are the ones of
# release.yml.
on:
  pull_request:
  push:
    branches:
      - main
      - "goal/**"

# A pull request runs once, on its own event, and a newer commit cancels the run it supersedes. A
# push to main or a goal branch is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: read-all

jobs:
  ci:
    # A hosted runner label cannot be pinned. It names the version, and the first step records what
    # it resolved to. Moved by: the PM, when GitHub announces the label's retirement.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Record what the runner resolved to
        run: |
          echo "image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          shellcheck --version | sed -n 2p

      # lib/init/linux's packet-socket test runs in a user and network namespace of its own. Ubuntu
      # 24.04 denies an unprivileged user the capabilities inside one unless this is off.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Unit tests under tooling/qemu build disks with qemu-img and copy OVMF's variable store; the
      # runner image carries neither. They are the distribution's packages, not pinned.
      - name: Install qemu-utils and ovmf
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-utils ovmf

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: "**/go.sum"

      # TEST_TIMEOUT bounds each package's tests below the job's timeout: a test that hangs fails its
      # package with every goroutine printed, instead of the job being cancelled with no log.
      - name: Run the checks
        env:
          TEST_TIMEOUT: 20m
        run: make ci
