    cluster.x-k8s.io/v1beta2: v1alpha1
  name: narumachines.naru.garam.sh
spec:
  group: naru.garam.sh
  names:
    categories:
    - cluster-api
    - naru
    kind: NaruMachine
    listKind: NaruMachineList
    plural: narumachines
    shortNames:
    - nm
    singular: narumachine
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.host
      name: Host
      type: string
    - jsonPath: .status.initialization.provisioned
      name: Provisioned
      type: boolean
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NaruMachine is one Node's microVM.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              NaruMachineSpec is one Node's microVM. It follows Cluster API's InfraMachine contract at contract
              version v1beta2. The Node's role, version and cluster come from its Machine.
            properties:
              cpu:
                description: cpu is the microVM's CPUs.
                format: int32
                minimum: 1
                type: integer
              memory:
                anyOf:
                - type: integer
                - type: string
                description: memory is the microVM's memory.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              providerID:
                description: providerID is the Node's provider ID, set by the infrastructure
                  provider.
                maxLength: 512
                minLength: 1
                type: string
            required:
            - cpu
            - memory
            type: object
          status:
            description: NaruMachineStatus is what the infrastructure provider observed
              of the microVM.
            properties:
              addresses:
                description: addresses are the Node's addresses.
                items:
                  description: MachineAddress contains information for the node's
                    address.
                  properties:
                    address:
                      description: address is the machine address.
                      maxLength: 256
                      minLength: 1
                      type: string
                    type:
                      description: type is the machine address type, one of Hostname,
                        ExternalIP, InternalIP, ExternalDNS or InternalDNS.
                      enum:
                      - Hostname
                      - ExternalIP
                      - InternalIP
                      - ExternalDNS
                      - InternalDNS
                      type: string
                  required:
                  - address
                  - type
                  type: object
                maxItems: 32
                type: array
              conditions:
                description: conditions holds Ready, which mirrors into the Machine's
                  InfrastructureReady.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              host:
                description: host is the name of the NaruHost that runs the microVM.
                  It is chosen once and never changes.
                maxLength: 253
                type: string
              initialization:
                description: initialization is the Cluster API initialization contract.
                minProperties: 1
                properties:
                  provisioned:
                    description: provisioned is true when the microVM runs.
                    type: boolean
                type: object
              podCIDR:
                description: podCIDR is the Node's Pod range, in CIDR form, a /24
                  inside the cluster's prefix.
                maxLength: 64
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
