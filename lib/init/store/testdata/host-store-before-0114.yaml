revision: 1
baseSha256: ab
config:
  apiVersion: naru.garam.sh/v1alpha1
  kind: NodeConfig
  metadata:
    name: naru-node-1
  spec:
    services:
    - name: mvmd
      binary: /bin/mvmd
      args:
      - -config
      - /run/mvmd/config.json
      env:
        HOME: /run/naru/registry/home
        PATH: /bin:/run/bin
      controlPlane: false
      logFiles:
      - /run/naru/registry/home/.ecr/log/ecr-login.log
    - name: naru-hostd
      binary: /bin/naru-hostd
      args:
      - --listen
      - 0.0.0.0:7443
      - --host-id
      - node-1
      - --advertise
      - 192.168.0.40:7443
      - --cert
      - /run/naru-hostd/tls.crt
      - --key
      - /run/naru-hostd/tls.key
      - --client-ca
      - /run/naru-hostd/client-ca.crt
      - --host-file
      - /run/naru-hostd/host.json
      - --mvmd-socket
      - /run/mvmd.sock
      - --machine-gateway
      - 10.200.1.1
      env:
        PATH: /bin
      controlPlane: false
    - name: registry
      binary: /var/lib/naru/inputs/bin/naru-registry
      args:
      - -listen
      - 127.0.0.1:5000
      - -dir
      - /var/lib/naru/inputs/registry
      env: {}
      controlPlane: false
    controlPlane: false
    dataDisk:
      device: ''
      label: NARUDATA
      mountPoint: /var/lib/naru
    network:
      forwarding:
      - ipv4
    files:
    - path: /run/mvmd/config.json
      mode: '0600'
      content: |
        {
          "boot_timeout": "2m",
          "call_timeout": "5m",
          "conversion": {
            "converter": "naru-converter",
            "initrd": {{json .converter_initrd.path}},
            "initrd_sha256": {{json .converter_initrd.sha256}},
            "kernel": {{json (index .kernels .default_kernel).path}},
            "kernel_sha256": {{json (index .kernels .default_kernel).sha256}},
            "limit": "5m",
            "memory_bytes": 536870912,
            "name_set_bytes": 1048576,
            "output_bytes": 268435456,
            "vcpus": 2
          },
          "disk": {
            "mkfs": "/bin/mkfs.ext4"
          },
          "driver": "firecracker",
          "firecracker": {
            "binary": "/bin/firecracker",
            "binary_sha256": "7777777777777777777777777777777777777777777777777777777777777777",
            "default_kernel": {{json .default_kernel}},
            "initrd": {{json .guest_initrd.path}},
            "initrd_sha256": {{json .guest_initrd.sha256}},
            "kernels": {{json .kernels}}
          },
          "network": {
            "ipv4_gateway": "10.200.1.1",
            "ipv4_prefix": "10.200.1.0/24",
            "resolvers": [
              "10.200.1.1"
            ]
          },
          "pull_timeout": "4m",
          "registry": {
            "credentials_file": "/run/naru/registry/credentials.json"
          },
          "socket": {
            "mode": "0660",
            "path": "/run/mvmd.sock"
          },
          "state_dir": "/var/lib/naru/mvmd",
          "supervision": {
            "binary": "/bin/mvmd-supervisor",
            "cgroup": "/sys/fs/cgroup/naru/detached"
          },
          "vmm_uid_range": {
            "count": 1000,
            "first": 100000
          }
        }
      template: guest
    - path: /run/gaon/ca.pem
      mode: '0644'
